site_name: MkLume
site_description: A visual desktop editor for MkDocs Material documentation.
site_url: https://www.ecalstudios.com/mklume/
repo_url: https://github.com/ECalStudios/mklume
repo_name: ECalStudios/mklume

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ECalStudios/mklume
      name: MkLume on GitHub
    - icon: fontawesome/solid/heart
      link: https://ko-fi.com/ecalstudios
      name: Support Development on Ko-fi

copyright: "Copyright &copy; 2026 ECal Studios"

