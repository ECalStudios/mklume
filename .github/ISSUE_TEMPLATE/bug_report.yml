name: Bug Report
description: Report a bug or unexpected behavior in MkLume.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can understand and reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Open a project
        2. Go to...
        3. Click on...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g., Windows 11, macOS 14, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MkLume version
      placeholder: "e.g., 1.0.0 or built from source"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: If applicable, add screenshots or paste error messages.
    validations:
      required: false
