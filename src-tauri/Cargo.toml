[package]
name = "mklume"
version = "1.0.1"
description = "MkLume — A visual desktop editor for MkDocs Material documentation"
authors = ["ECal Studios"]
license = "GPL-3.0-only"
homepage = "https://www.ecalstudios.com/mklume/"
repository = "https://github.com/ECalStudios/mklume"
edition = "2021"

[lib]
name = "mklume_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
